# Global agent configuration
[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  debug = false
  quiet = false
  hostname = ""
  omit_hostname = false

# MQTT Consumer Input Plugin
[[inputs.mqtt_consumer]]
  servers = ["mqtt://10.0.0.90:1883"]
  username = "${MQTT_USER_NAME}"
  password = "${MQTT_PASSWORD}"

  # Set custom measurement name
  name_override = "my_python_mositure_temp"
  
  # Topics to subscribe to
  topics = [
    "iot"
  ]
  
  # Connection timeout
  connection_timeout = "30s"
  
  # TLS/SSL configuration
  insecure_skip_verify = true
  
  # QoS level
  qos = 0
  
  # Client ID
  client_id = "telegraf_mqtt_consumer"
  
  # Data format
  data_format = "influx"
  data_type = ""

# InfluxDB v2 Output Plugin
[[outputs.influxdb_v2]]
  # URL for your local InfluxDB
  urls = ["http://localhost:8086"]
  
  # InfluxDB token
  token = "NbKWuL8c9tfdsP_oHm5UF7N-u011a59d8ma8Zpnkg6HDhI6P9RjAwWeUYvfd_iTrxmY7WBRRRHKd6uHMg1H41Q=="

  # Organization name
  organization = "rowan"
  
  # Destination bucket
  bucket = "iot"

  # Add tags - match the location from your MQTT script
  #[outputs.influxdb_v2.tags]
  #location = "study_room"

